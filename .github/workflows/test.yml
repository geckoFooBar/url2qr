name: Quality  & Testing Workflow

on: 
    push:
        branches: 
            - main
    pull_request:
        branches:
            - main

jobs:
  lint-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" 

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
    
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" 

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm test

      - name: Build Production
        run: npm run build -- --configuration production